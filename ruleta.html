<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wheel of Names</title>
    <style>
        :root{
            --bg:#0b0b10;--panel:#11121a;--panel-2:#151728;--text:#eaeef6;--muted:#9aa4b2;--brand:#5b8cff;--brand-2:#7b5bff;--shadow:0 10px 30px rgba(0,0,0,.45);
        }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 800px at 10% 10%, #12152a 0%, #0b0b10 55%), radial-gradient(1200px 800px at 90% 90%, #0c132a 0%, #0b0b10 55%);color:var(--text);}

        .header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid #1e2235;background:linear-gradient(180deg, rgba(21,24,39,.75), rgba(17,18,26,.75));backdrop-filter:blur(8px);flex-wrap:wrap}
        .logo{display:flex;align-items:center;gap:.5rem;font-weight:700;letter-spacing:.2px;font-size:1rem}
        .logo-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:white;background:conic-gradient(from 210deg at 50% 50%, var(--brand), var(--brand-2));box-shadow:0 0 0 2px #0f1220;font-size:.9rem}
        .toolbar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
        .btn{appearance:none;border:1px solid #2a2f45;background:#13172a;color:var(--text);padding:.45rem .7rem;border-radius:.55rem;cursor:pointer;font-size:.85rem;transition:.2s;display:inline-flex;align-items:center;gap:.4rem}
        .btn:hover{background:#1a1f3a;border-color:#394064}
        .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;box-shadow:0 4px 12px rgba(91,140,255,.25)}
        .btn.primary:hover{transform:translateY(-1px)}

        .app{display:grid;grid-template-columns:1fr 340px;gap:1rem;max-width:1200px;margin:0 auto;padding:1rem}
        @media (max-width: 980px){.app{grid-template-columns:1fr}}
        @media (max-width: 500px){
            .logo{font-size:.9rem}
            .toolbar{width:100%;justify-content:flex-start}
        }

        .stage{background:linear-gradient(180deg,#0f1220,#0b0b10);border:1px solid #1e2235;border-radius:20px;box-shadow:var(--shadow);display:grid;place-items:center;position:relative;overflow:hidden}
        .wheel-wrap{position:relative;inline-size:min(88vw,540px);aspect-ratio:1;max-inline-size:720px}
        canvas{width:100%;height:100%;display:block}

        .pointer{position:absolute;inset-inline:0;top:6px;display:grid;place-items:center;pointer-events:none;}
        .pointer .arrow{width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:26px solid var(--brand);filter:drop-shadow(0 6px 10px rgba(91,140,255,.45));}

        .hub{position:absolute;inset:0;display:grid;place-items:center;}
        .spin-btn{width:80px;height:80px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 30% 30%, #ffffff, #dbe5ff);color:#111;font-weight:800;letter-spacing:.5px;box-shadow:0 10px 22px rgba(255,255,255,.15), inset 0 0 0 4px #2a2f45;transition:.2s;}
        .spin-btn:active{transform:scale(.98)}

        .panel{background:linear-gradient(180deg,#101325,#0c0f1d);border:1px solid #1e2235;border-radius:20px;padding:1rem;box-shadow:var(--shadow)}
        .panel h3{margin:.2rem 0 1rem;font-size:.95rem;color:var(--muted);font-weight:600}
        .row{display:flex;gap:.5rem}
        .input{flex:1;min-width:0;border:1px solid #2a2f45;background:#0f1326;color:var(--text);padding:.65rem .8rem;border-radius:.55rem;font-size:.95rem}
        .input:focus{outline:none;border-color:#3c4a7a;box-shadow:0 0 0 3px rgba(91,140,255,.2)}

        .list{display:grid;gap:.5rem;margin-top:1rem;max-height:45vh;overflow:auto;padding-right:.25rem}
        .chip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.6rem;background:#0e1224;border:1px solid #1f2742;border-radius:.7rem;padding:.45rem .6rem}
        .swatch{width:16px;height:16px;border-radius:4px;border:1px solid #0003}
        .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .x{background:none;border:none;color:#94a0b8;font-size:16px;cursor:pointer}
        .x:hover{color:#fff}

        .subgrid{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;margin-top:1rem}
        .slider{width:100%}
        .hint{font-size:.8rem;color:var(--muted)}
        .stat{font-size:.8rem;color:var(--muted)}

        .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}
        .card{background:linear-gradient(180deg,#0f1328,#0d1020);border:1px solid #222a44;border-radius:18px;padding:1.25rem 1.25rem 1.4rem;max-width:92vw;width:420px;text-align:center;box-shadow:var(--shadow)}
        .title{font-size:1.35rem;margin:.2rem 0 1rem;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:.3px}
        .winner{font-size:2rem;font-weight:900}
        .ok{margin-top:1rem}
    </style>
</head>
<body>
<header class="header">
    <div class="logo"><div class="logo-icon">W</div><div>wheelofnames.com</div></div>
    <div class="toolbar">
        <button class="btn" id="btnNew">🆕 New</button>
        <button class="btn" id="btnShare">🔗 Share</button>
    </div>
</header>

<main class="app">
    <section class="stage">
        <div class="wheel-wrap">
            <canvas id="wheel"></canvas>
            <div class="pointer"><div class="arrow"></div></div>
            <div class="hub">
                <button class="spin-btn" id="spinBtn" aria-label="Spin">SPIN</button>
            </div>
        </div>
    </section>

    <aside class="panel">
        <h3>Entries <span class="stat">• results: <span id="resultsCount">0</span></span></h3>
        <div class="row">
            <input id="entryInput" class="input" placeholder="Type name and press Enter" />
            <button id="addBtn" class="btn">+ Add</button>
        </div>

        <div class="subgrid">
            <div>
                <div class="hint">Spin duration (seconds): <strong id="durVal">4.0</strong></div>
                <input id="duration" class="slider" type="range" min="2" max="12" step="0.5" value="4" />
            </div>
            <button id="spinQuick" class="btn">🎯 Spin</button>
        </div>

        <div id="list" class="list"></div>
    </aside>
</main>

<div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="card">
        <div class="title">🎉 Winner!</div>
        <div id="winnerName" class="winner"></div>
        <button id="closeModal" class="btn ok">OK</button>
    </div>
</div>

<div id="shareModal" class="modal">
    <div class="card">
        <div class="title">Share</div>
        <input id="shareLink" class="input" value="https://wheelofnames.com/session/123" readonly />
        <div style="display:flex;gap:.5rem;margin-top:1rem;justify-content:center;">
            <button id="copyLink" class="btn primary">Copy</button>
            <button id="closeShare" class="btn">Cancel</button>
        </div>
    </div>
</div>

<script>
    const wheel = document.getElementById('wheel');
    const ctx = wheel.getContext('2d');
    const entryInput = document.getElementById('entryInput');
    const addBtn = document.getElementById('addBtn');
    const listEl = document.getElementById('list');
    const spinBtn = document.getElementById('spinBtn');
    const spinQuick = document.getElementById('spinQuick');
    const modal = document.getElementById('modal');
    const winnerNameEl = document.getElementById('winnerName');
    const closeModal = document.getElementById('closeModal');
    const resultsCount = document.getElementById('resultsCount');
    const durationEl = document.getElementById('duration');
    const durValEl = document.getElementById('durVal');
    const btnNew = document.getElementById('btnNew');
    const btnShare = document.getElementById('btnShare');
    const shareModal = document.getElementById('shareModal');
    const closeShare = document.getElementById('closeShare');
    const copyLink = document.getElementById('copyLink');
    const shareLink = document.getElementById('shareLink');

    function sizeCanvas(){
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const s = Math.min(wheel.parentElement.clientWidth, 1000);
        wheel.width = Math.floor(s * dpr);
        wheel.height = Math.floor(s * dpr);
        wheel.style.width = s + 'px';
        wheel.style.height = s + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        drawWheel();
    }
    window.addEventListener('resize', sizeCanvas);

    let entries = [];
    let currentRotation = 0;
    let spinning = false;
    let idle = true;
    let idleSpeed = 0.0045;

    const TAU = Math.PI * 2;

    function colorAt(i, n){
        const h = (i / n) * 360;
        return `hsl(${h} 75% 55%)`;
    }

    function normalize(a){ a = a % TAU; if (a < 0) a += TAU; return a; }

    function hasTrailingSpace(str){ return /\s$/.test(str); }

    function addEntryRaw(value){
        if(!value || !value.trim()) return;
        const rigged = hasTrailingSpace(value);
        if(rigged){
            entries = entries.map(v => v.replace(/\s+$/,''));
        }
        entries.push(value);
        renderList(); drawWheel();
    }

    function removeEntryAt(idx){ entries.splice(idx,1); renderList(); drawWheel(); }

    function drawWheel(){
        const W = wheel.width / (window.devicePixelRatio? Math.min(window.devicePixelRatio,2):1);
        const H = wheel.height / (window.devicePixelRatio? Math.min(window.devicePixelRatio,2):1);
        const cx = W/2, cy = H/2;
        const r = Math.min(W,H)/2 - 18;
        ctx.clearRect(0,0,W,H);
        const g = ctx.createRadialGradient(cx,cy, r*0.1, cx,cy, r*1.05);
        g.addColorStop(0,'#0f1224'); g.addColorStop(1,'#07080f');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,r+14,0,TAU); ctx.fill();
        if(entries.length === 0){ ctx.fillStyle = '#1c2038'; ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill(); return; }
        const n = entries.length; const aPer = TAU / n;
        for (let i = 0; i < n; i++) {
            const start = currentRotation + i * aPer;
            const end = start + aPer;

            // segment
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, end);
            ctx.closePath();
            ctx.fillStyle = colorAt(i, n);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.28)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // text
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(start + aPer / 2);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff';
            ctx.font = '700 16px system-ui';
            const label = entries[i].replace(/\s+$/, '');
            const text = label.length > 22 ? label.slice(0, 22) + '…' : label;
            ctx.fillText(text, 0, -r * 0.75);
            ctx.restore();
        }

        ctx.beginPath(); ctx.arc(cx,cy,48,0,TAU);
        const cg = ctx.createLinearGradient(0,cy-48,0,cy+48);
        cg.addColorStop(0,'#e7efff'); cg.addColorStop(1,'#c9d7ff');
        ctx.fillStyle = cg; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = '#2a2f45'; ctx.stroke();
    }

    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

    function spinStrong(){
        if(entries.length===0 || spinning) return;
        spinning = true; idle = false;
        let rigIdx = -1;
        for(let i=entries.length-1;i>=0;i--){ if(hasTrailingSpace(entries[i])){ rigIdx = i; break; } }
        const n = entries.length; const spins = 5 + Math.random()*2;
        let targetIdx = rigIdx !== -1 ? rigIdx : Math.floor(Math.random()*n);
        const aPer = TAU / n;
        const baseTurns = Math.floor(currentRotation / TAU) * TAU;
        const targetCenter = -Math.PI/2 - targetIdx * aPer;
        let target = baseTurns + spins * TAU + targetCenter;
        while (target <= currentRotation) target += TAU;
        const start = currentRotation; const dur = parseFloat(durationEl.value) * 1000; const t0 = performance.now();
        function tick(now){
            const t = Math.min(1,(now-t0)/dur); const v = easeOutCubic(t);
            currentRotation = start + (target - start) * v;
            drawWheel();
            if(t<1) requestAnimationFrame(tick);
            else { currentRotation = target; drawWheel(); spinning=false; idle=true; showWinner(entries[targetIdx].replace(/\s+$/,'')); }
        }
        requestAnimationFrame(tick);
    }

    function loop(){ if(idle && !spinning){ currentRotation += idleSpeed; } drawWheel(); requestAnimationFrame(loop); }

    function showWinner(name){
        winnerNameEl.textContent = name;
        modal.style.display = 'flex';
    }

    function renderList(){
        listEl.innerHTML = '';
        entries.forEach((v,i)=>{
            const chip=document.createElement('div');
            chip.className='chip';
            const sw=document.createElement('div');sw.className='swatch';sw.style.background=colorAt(i,entries.length);
            const nm=document.createElement('div');nm.className='name';nm.textContent=v.replace(/\s+$/,'');
            const rm=document.createElement('button');rm.className='x';rm.textContent='×';rm.onclick=()=>removeEntryAt(i);
            chip.append(sw,nm,rm);listEl.appendChild(chip);
        });
        resultsCount.textContent=entries.length;
    }

    addBtn.onclick=()=>{ addEntryRaw(entryInput.value); entryInput.value=''; }
    entryInput.addEventListener('keypress',e=>{ if(e.key==='Enter'){ addEntryRaw(entryInput.value); entryInput.value=''; } });
    spinBtn.onclick=spinStrong; spinQuick.onclick=spinStrong;
    closeModal.onclick=()=>{ modal.style.display='none'; }
    btnNew.onclick=()=>{ entries=[]; renderList(); drawWheel(); }
    btnShare.onclick=()=>{ shareModal.style.display='flex'; }
    closeShare.onclick=()=>{ shareModal.style.display='none'; }
    copyLink.onclick=()=>{ shareLink.select(); document.execCommand('copy'); }

    durationEl.oninput=()=>{ durValEl.textContent=parseFloat(durationEl.value).toFixed(1); }

    sizeCanvas(); renderList(); requestAnimationFrame(loop);
</script>
</body>
</html>
