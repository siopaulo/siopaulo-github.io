<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pavel Vršecký</title>

  <meta
    name="description"
    content="Původní portfolio Pavla Vršeckého bylo přesunuto na pavelvrsecky.cz."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #0e0f14;
      color: #f5f3ed;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 620px);
      text-align: center;
    }

    .label {
      margin-bottom: 1rem;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8f9098;
    }

    h1 {
      margin-bottom: 1.25rem;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0 auto 2rem;
      max-width: 42ch;
      color: #b9bac1;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 1rem 1.5rem;
      border: 1px solid #f5f3ed;
      color: #f5f3ed;
      text-decoration: none;
      font-weight: 600;
      transition: background 160ms ease, color 160ms ease;
    }

    a:hover,
    a:focus-visible {
      background: #f5f3ed;
      color: #0e0f14;
    }

    a:focus-visible {
      outline: 3px solid #6d82ff;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <div class="label">Pavel Vršecký</div>

    <h1>Najdete mě nově zde.</h1>

    <p>
      Moje aktuální portfolio, projekty a informace o mé práci jsou nyní
      na nové adrese.
    </p>

    <a href="https://pavelvrsecky.cz">
      pavelvrsecky.cz
    </a>
  </main>
</body>
</html>
